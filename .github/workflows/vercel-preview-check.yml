name: Vercel preview build checks

on:
  push:
    branches:
      - chore/vercel-ai-game-studio
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: vercel-preview-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Build public workspace
        run: npx vite build --config vercel.vite.config.ts

      - name: Build internal DevHost
        run: npm run build --workspace=@tools/dev-host
